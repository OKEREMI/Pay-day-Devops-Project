name: Microservices CI/CD

on:
  push:
    branches: ["main"]

# Prevent concurrent runs on the same branch — avoids race conditions on manifest updates and docker pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1 — Detect which services actually changed
  # This avoids rebuilding services that weren't touched
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # dorny/paths-filter compares changed files against path patterns and outputs a JSON array of which "filters" matched
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            payment-service:
              - 'payment-service/**'
            dashboard:
              - 'dashboard/**'

  # JOB 2 — Build, Scan, and Push (only changed services)
  build-and-scan:
    name: Build & Scan — ${{ matrix.service }}
    needs: detect-changes
    permissions:
      security-events: write  # required for SARIF upload to GitHub Security tab
      contents: read
    # Skip entirely if nothing relevant changed
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # Let other services finish even if one fails
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
        include:
          # Per-service build args — only dashboard needs VITE vars
          - service: dashboard
            build_args: |
              VITE_AUTH_URL=http://auth-service:4001
              VITE_PAYMENT_URL=http://payment-service:4002
          - service: auth-service
            build_args: ""
          - service: payment-service
            build_args: ""

    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Step 1: Filesystem scan — TEMPORARILY DISABLED ──
      # TODO: Re-enable once CVE-2026-26996 (minimatch) is patched upstream in ts-node-dev/swagger-jsdoc
      # - name: Run Trivy filesystem scan
      #   uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
      #   with:
      #     scan-type: "fs"
      #     scan-ref: "./${{ matrix.service }}"
      #     exit-code: "1"
      #     severity: "CRITICAL,HIGH"
      #     format: "sarif"
      #     output: "trivy-fs-${{ matrix.service }}.sarif"
      #     trivyignores: "./${{ matrix.service }}/.trivyignore"

      # - name: Upload FS scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda # v3.26.1
      #   if: always()
      #   continue-on-error: true
      #   with:
      #     sarif_file: "trivy-fs-${{ matrix.service }}.sarif"
      #     category: "trivy-fs-${{ matrix.service }}"

      # ── Step 2: Build image ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and load step removed — only needed when image scan is active
      # Uncomment when re-enabling Trivy image scan
      # - name: Build and load image (for scanning)
      #   uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
      #   with:
      #     context: ./${{ matrix.service }}
      #     load: true
      #     push: false
      #     tags: ${{ env.DOCKER_IMAGE }}:tmp
      #     build-args: ${{ matrix.build_args }}
      #     cache-from: type=gha,scope=${{ matrix.service }}
      #     cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ── Step 3: Image scan — TEMPORARILY DISABLED ──
      # TODO: Re-enable once CVE-2026-26996 (minimatch) is patched upstream in ts-node-dev/swagger-jsdoc
      # - name: Run Trivy image scan
      #   uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
      #   with:
      #     image-ref: "${{ env.DOCKER_IMAGE }}:tmp"
      #     exit-code: "1"
      #     severity: "CRITICAL,HIGH"
      #     format: "sarif"
      #     output: "trivy-image-${{ matrix.service }}.sarif"
      #     trivyignores: "./${{ matrix.service }}/.trivyignore"

      # - name: Upload image scan results to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda # v3.26.1
      #   if: always()
      #   continue-on-error: true
      #   with:
      #     sarif_file: "trivy-image-${{ matrix.service }}.sarif"
      #     category: "trivy-image-${{ matrix.service }}"

      # ── Step 4: Push ──
      # Push by SHA tag only — :latest is avoided intentionally.
      # GitOps manifests are the source of truth for what's deployed,
      # so a mutable :latest tag adds confusion with no benefit.
      - name: Push image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: ${{ matrix.build_args }}
          # Reuses the layers already cached by the build step above — no rebuild
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # JOB 3 — GitOps manifest update
  # Runs once, after ALL matrix build jobs pass
  update-manifests:
    name: Update PayDay Infra
    needs: [detect-changes, build-and-scan]
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TripleAze/PayDay-Infra
          token: ${{ secrets.GH_PAT }}

      # Install yq for reliable, structured YAML editing
      # sed-based replacements are brittle — yq is purpose-built for this
      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      # Loop over only the services that were actually rebuilt this run
      - name: Update image tags in manifests
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          NEW_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Services to update: $CHANGED_SERVICES"

          # Map service names to their actual folder names in the infra repo
          declare -A SERVICE_FOLDERS
          SERVICE_FOLDERS["auth-service"]="auth"
          SERVICE_FOLDERS["payment-service"]="payment"
          SERVICE_FOLDERS["dashboard"]="dashboard"

          for service in $(echo "$CHANGED_SERVICES" | jq -r '.[]'); do
            FOLDER=${SERVICE_FOLDERS[$service]}
            MANIFEST_PATH="k8s/${FOLDER}/deployment.yaml"

            if [ ! -f "$MANIFEST_PATH" ]; then
              echo "WARNING: Manifest not found at $MANIFEST_PATH — skipping"
              continue
            fi

            NEW_IMAGE="${DOCKERHUB_USERNAME}/${service}:${NEW_TAG}"
            echo "Updating $MANIFEST_PATH → $NEW_IMAGE"

            # yq targets the exact image field — immune to formatting changes
            yq e ".spec.template.spec.containers[0].image = \"${NEW_IMAGE}\"" \
              -i "$MANIFEST_PATH"
          done

      - name: Commit and push manifest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          # Only commit if there are actual changes — avoids empty commits
          if git diff --staged --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore: update images to ${GITHUB_SHA::8} [skip ci]

          Services updated: ${{ needs.detect-changes.outputs.services }}
          Triggered by: ${{ github.actor }} @ ${{ github.sha }}"

          git push
